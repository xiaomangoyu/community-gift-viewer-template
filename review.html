<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Community Gift Review</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f7;
      --panel: #ffffff;
      --line: #e8e8ed;
      --line-strong: #d2d2d7;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --soft: #f5f5f7;
      --soft-strong: #eeeef0;
      --accent: #0071e3;
      --accent-soft: #eaf3ff;
      --green: #248a3d;
      --green-soft: #edf8f0;
      --amber: #8a5a00;
      --amber-soft: #fff7e6;
      --red: #b42318;
      --red-soft: #fff0ee;
      --ink: #1d1d1f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow-x: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.48;
      -webkit-font-smoothing: antialiased;
    }
    body.modal-open { overflow: hidden; }
    button { font: inherit; }
    button {
      border: 1px solid transparent;
      background: var(--panel);
      color: var(--text);
      border-radius: 7px;
      padding: 7px 11px;
      cursor: pointer;
    }
    button:hover, button.active {
      border-color: var(--line);
      background: #f9f9fb;
    }
    button:focus-visible, a:focus-visible, summary:focus-visible {
      outline: 3px solid rgba(0,113,227,.24);
      outline-offset: 2px;
    }
    .page { max-width: 1720px; margin: 0 auto; padding: 18px 24px 40px; }
    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      min-height: 52px;
      padding: 0 2px 14px;
      border-bottom: 1px solid var(--line);
    }
    .title h1 { margin: 0 0 3px; font-size: 24px; font-weight: 650; letter-spacing: 0; }
    .title { min-width: 0; }
    .title p { margin: 0; color: var(--muted); max-width: 900px; font-size: 12px; overflow-wrap: anywhere; }
    .topbar-actions { display: flex; flex: 0 1 620px; min-width: 0; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 9px; }
    .view-tabs, .lang-switch { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border: 1px solid #e2e4e8; border-radius: 10px; background: #eef0f3; }
    .view-tab, .lang-button { display: inline-flex; align-items: center; justify-content: center; min-height: 30px; padding: 5px 10px; border: 0; border-radius: 7px; color: #5f6369; background: transparent; font-size: 12px; font-weight: 600; line-height: 1; text-decoration: none; white-space: nowrap; }
    .view-tab:hover, .lang-button:hover { color: var(--text); background: rgba(255,255,255,.68); }
    .view-tab.active, .lang-button.active { color: #075ea9; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.07), 0 0 0 1px rgba(0,113,227,.08); }
    .utility-button { min-height: 36px; padding: 7px 11px; border: 1px solid #dfe2e7; border-radius: 9px; color: #34373c; background: rgba(255,255,255,.9); font-size: 12px; font-weight: 600; }
    .utility-button:hover { border-color: #c9ced6; background: #fff; }
    .run-context { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; color: var(--muted); font-size: 12px; }
    .run-context strong { color: var(--text); font-weight: 600; }
    .status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); vertical-align: 1px; margin-right: 5px; }
    .status-dot.ok { background: var(--green); }
    .status-dot.warn { background: #d97706; }
    .status-dot.fail { background: var(--red); }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 0;
      margin: 14px 0 8px;
      overflow: hidden;
      background: var(--panel);
      border-radius: 12px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .035), 0 10px 28px rgba(0, 0, 0, .025);
    }
    .metric {
      background: transparent;
      border: 0;
      border-right: 1px solid var(--line);
      border-radius: 0;
      padding: 14px 16px;
      min-height: 72px;
    }
    .metric:last-child { border-right: 0; }
    .metric .label { color: var(--muted); font-size: 12px; }
    .metric .value { font-size: 24px; font-weight: 620; margin-top: 2px; letter-spacing: 0; }
    .run-diagnostics { margin: 0 0 12px; border: 0; background: transparent; }
    .run-diagnostics summary { display: inline-flex; align-items: center; gap: 5px; padding: 5px 2px; color: var(--muted); font-size: 12px; font-weight: 500; }
    .run-diagnostics > .details-body { margin-top: 6px; padding: 12px 14px; border: 0; border-radius: 8px; background: rgba(255,255,255,.72); }
    .diagnostic-grid { display: grid; grid-template-columns: repeat(6, minmax(110px, 1fr)); gap: 12px; }
    .diagnostic-item span { display: block; color: var(--muted); font-size: 11px; }
    .diagnostic-item strong { display: block; margin-top: 2px; font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
    .variant-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 8px;
    }
    .variant-summary-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, .72);
      color: var(--muted);
      font-size: 12px;
    }
    .variant-summary-item strong { color: var(--text); }
    .timeline {
      display: grid;
      grid-template-columns: repeat(5, minmax(150px, 1fr));
      gap: 0;
      margin: 8px 0 18px;
      overflow-x: auto;
      padding: 14px 12px 12px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .025), 0 8px 24px rgba(0,0,0,.018);
      counter-reset: workflow-step;
    }
    .workflow-intro {
      display: flex;
      align-items: baseline;
      min-width: 0;
      gap: 10px;
      margin: 10px 2px 0;
    }
    .workflow-intro strong { min-width: 0; font-size: 13px; font-weight: 650; overflow-wrap: anywhere; }
    .workflow-intro span { color: var(--accent); font-size: 11px; font-weight: 650; }
    .workflow-intro p { min-width: 0; margin: 0; color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
    .stage {
      position: relative;
      min-height: 66px;
      padding: 29px 10px 4px;
      background: transparent;
      border: 0;
      border-radius: 0;
      counter-increment: workflow-step;
    }
    .stage::before {
      content: counter(workflow-step);
      position: absolute;
      top: 0;
      left: 10px;
      z-index: 1;
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 11px;
      font-weight: 650;
    }
    .stage::after {
      content: "";
      position: absolute;
      top: 10px;
      left: 38px;
      width: calc(100% - 34px);
      height: 1px;
      background: var(--line-strong);
    }
    .stage:last-child::after { display: none; }
    .stage b { display: block; font-size: 13px; }
    .stage span { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
    .stage.later {
      color: var(--muted);
    }
    .stage.later::before { background: var(--soft); color: #86868b; }
    .stage.later::after { background: none; border-top: 1px dashed var(--line-strong); }
    .layout {
      display: block;
      margin-top: 12px;
    }
    .panel {
      background: var(--panel);
      border: 0;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 10px 30px rgba(0, 0, 0, .025);
    }
    .badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border-radius: 999px;
      padding: 3px 7px;
      font-size: 12px;
      background: #f2f2f4;
      border: 0;
      color: var(--text);
    }
    .badge.ok { background: var(--green-soft); color: #1d6f34; }
    .badge.warn { background: var(--amber-soft); color: #7a4b00; }
    .badge.fail { background: var(--red-soft); color: #9f2118; }
    .badge.soft { background: var(--accent-soft); color: #075ea9; }
    #summary > .badges { margin: 0 2px 10px; }
    #summary > .badges .badge { background: rgba(255,255,255,.72); color: var(--muted); }
    #summary > .badges .badge.ok { color: #1d6f34; }
    #summary > .badges .badge.warn { color: #7a4b00; }
    #summary > .badges .badge.soft { color: #075ea9; }
    .identity-strip { display: flex; min-width: 0; align-items: center; justify-content: space-between; gap: 16px; padding: 2px 2px 12px; border-bottom: 1px solid var(--line); }
    .identity-main { display: grid; grid-template-columns: 36px minmax(0, 1fr); align-items: center; gap: 9px; }
    .identity-main > img { width: 36px; height: 36px; object-fit: cover; border-radius: 8px; background: var(--soft); }
    .identity-main h2 { margin: 0 0 2px; font-size: 17px; line-height: 1.2; }
    .identity-main p { margin: 0; color: var(--muted); font-size: 12px; }
    .identity-status { display: flex; min-width: 0; flex-wrap: wrap; justify-content: flex-end; gap: 10px; color: var(--muted); font-size: 12px; }
    .identity-status .badge { max-width: 100%; white-space: normal; overflow-wrap: anywhere; }
    .tabs {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      flex-wrap: nowrap;
      gap: 18px;
      margin: 12px -2px 0;
      padding: 9px 2px 8px;
      overflow-x: auto;
      background: rgba(255, 255, 255, .96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }
    .tabs button { position: relative; flex: 0 0 auto; border: 0; background: transparent; color: var(--muted); border-radius: 0; padding: 7px 1px; }
    .tabs button:hover { background: transparent; color: var(--text); }
    .tabs button.active { background: transparent; color: var(--text); font-weight: 600; box-shadow: none; }
    .tabs button.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -9px; height: 2px; border-radius: 2px; background: var(--accent); }
    .tab-content {
      min-height: 300px;
      padding: 14px 4px 4px;
    }
    .two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
    .three-col { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .tab-content > .two-col > section,
    .tab-content > .three-col > section { border: 0; border-radius: 8px; padding: 13px; background: #f8f8fa; min-width: 0; }
    .preview-button {
      position: relative;
      display: grid;
      place-items: center;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 0;
      background: var(--soft);
      overflow: hidden;
      cursor: zoom-in;
    }
    .preview-button:hover { border-color: #9ecbfa; box-shadow: 0 0 0 3px var(--accent-soft); }
    .preview-button img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .zoom-hint {
      position: absolute;
      left: 6px;
      bottom: 6px;
      padding: 3px 6px;
      border-radius: 999px;
      background: rgba(23, 26, 21, .72);
      color: #fff;
      font-size: 11px;
      opacity: 0;
      transition: opacity .15s ease;
    }
    .preview-button:hover .zoom-hint, .preview-button:focus-visible .zoom-hint { opacity: 1; }
    .figure .preview-button { width: 100%; aspect-ratio: 1 / 1; border: 0; border-radius: 0; }
    h3 { margin: 0 0 10px; font-size: 16px; }
    h4 { margin: 12px 0 6px; font-size: 13px; color: var(--muted); text-transform: none; }
    .kv { width: 100%; border-collapse: collapse; font-size: 13px; }
    .kv th, .kv td { border-bottom: 1px solid var(--line); padding: 6px 7px; vertical-align: top; text-align: left; }
    .kv th { width: 34%; color: var(--muted); font-weight: 600; }
    .kv td { overflow-wrap: anywhere; word-break: break-word; }
    .list { margin: 0; padding-left: 18px; }
    .list li { margin: 4px 0; }
    pre {
      white-space: pre-wrap;
      overflow: auto;
      max-height: 320px;
      margin: 0;
      padding: 12px;
      background: #f7f7f9;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 12px;
    }
    .prompt-actions { display: flex; gap: 8px; margin-bottom: 8px; }
    .image-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .reference-strip { display: flex; gap: 12px; overflow-x: auto; padding: 2px 2px 8px; }
    .reference-strip .figure { flex: 0 0 min(320px, 42vw); }
    .embedded-reference { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
    .embedded-reference h4 { margin-top: 0; }
    .embedded-reference .reference-strip { padding-bottom: 2px; }
    .embedded-reference .figure { flex-basis: 100%; max-width: 260px; }
    .figure {
      border: 0;
      border-radius: 10px;
      overflow: hidden;
      background: #f5f5f7;
      box-shadow: inset 0 0 0 1px var(--line);
    }
    .figure img { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: contain; background: #f5f5f7; }
    .figure figcaption { padding: 8px 10px; color: var(--muted); font-size: 12px; }
    .review-workspace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 320px); gap: 18px; align-items: start; }
    .media-deck { display: grid; grid-template-columns: minmax(320px, 1.5fr) repeat(2, minmax(180px, .75fr)); gap: 10px; min-width: 0; }
    .media-tile { min-width: 0; overflow: hidden; border-radius: 10px; background: #fafafa; box-shadow: inset 0 0 0 1px var(--line); }
    .media-tile .preview-button { width: 100%; aspect-ratio: 1 / 1; border: 0; border-radius: 0; }
    .media-tile video { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: contain; background: #f0f0f2; }
    .media-caption { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; padding: 8px 10px; border-top: 1px solid var(--line); }
    .media-caption strong { display: block; font-size: 12px; font-weight: 600; }
    .media-caption span { display: block; color: var(--muted); font-size: 11px; }
    .media-empty { display: grid; place-items: center; aspect-ratio: 1 / 1; color: var(--muted); font-size: 12px; }
    .decision-rail { padding: 2px 0 0 16px; border-left: 1px solid var(--line); }
    .decision-rail h3 { margin-bottom: 4px; }
    .decision-rail .note { margin-bottom: 12px; }
    .decision-list { margin: 0; }
    .review-context { margin-top: 14px; padding: 14px; border-radius: 10px; background: #fafafa; box-shadow: inset 0 0 0 1px var(--line); }
    .review-context-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .review-context-head h3 { margin: 0 0 3px; }
    .review-context-head p { margin: 0; color: var(--muted); font-size: 12px; }
    .display-only-label { flex: 0 0 auto; padding: 4px 7px; border-radius: 999px; background: var(--accent-soft); color: #075ea9; font-size: 11px; font-weight: 600; }
    .review-context-profile { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 12px; align-items: start; }
    .review-context-avatar, .review-context-avatar img { width: 72px; height: 72px; border-radius: 10px; }
    .review-context-avatar { overflow: hidden; background: var(--soft); }
    .review-context-avatar img { object-fit: cover; }
    .review-context-copy { min-width: 0; }
    .review-context-copy strong { display: block; margin-bottom: 4px; font-size: 14px; }
    .review-context-copy p { margin: 4px 0; color: var(--muted); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .review-stickers { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 8px; margin-top: 12px; }
    .review-sticker { min-width: 0; margin: 0; overflow: hidden; border-radius: 9px; background: #fff; box-shadow: inset 0 0 0 1px var(--line); }
    .review-sticker .preview-button { width: 100%; aspect-ratio: 1 / 1; border: 0; border-radius: 9px 9px 0 0; }
    .review-sticker figcaption { padding: 7px 8px 9px; color: var(--muted); font-size: 11px; line-height: 1.4; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
    .decision-row { display: grid; grid-template-columns: 98px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .decision-row dt { color: var(--muted); font-size: 12px; font-weight: 500; }
    .decision-row dd { margin: 0; font-size: 13px; overflow-wrap: anywhere; }
    .developer-stack { display: grid; gap: 10px; }
    .developer-stack details { margin: 0; }
    .variant-thumbs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .variant-thumb { min-width: 0; }
    .variant-thumb .preview-button { width: 100%; aspect-ratio: 1 / 1; }
    .variant-label { margin-top: 3px; color: var(--muted); font-size: 11px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .candidate-list {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(220px, 280px);
      grid-template-rows: 1fr;
      gap: 8px;
      margin: 8px 0 14px;
      overflow-x: auto;
      padding-bottom: 6px;
    }
    .candidate {
      border: 0;
      border-radius: 8px;
      padding: 8px;
      background: #f5f5f7;
    }
    .candidate b, .candidate span, .candidate small {
      display: block;
      overflow-wrap: anywhere;
    }
    .candidate span { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .candidate small { color: var(--muted); font-size: 11px; margin-top: 4px; line-height: 1.35; }
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(10, 12, 10, .82);
    }
    .lightbox.open { display: flex; }
    .lightbox-panel {
      width: min(92vw, 1120px);
      max-height: 92vh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background: #11140f;
      color: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0,0,0,.45);
    }
    .lightbox-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255,255,255,.14);
    }
    .lightbox-title { font-weight: 700; overflow-wrap: anywhere; }
    .lightbox-close {
      border-color: rgba(255,255,255,.28);
      background: rgba(255,255,255,.08);
      color: #fff;
    }
    .lightbox-body {
      display: grid;
      place-items: center;
      min-height: 0;
      background: #050604;
    }
    .lightbox-body img {
      max-width: 100%;
      max-height: calc(92vh - 58px);
      object-fit: contain;
      display: block;
    }
    details { border: 1px solid var(--line); border-radius: 8px; background: #fbfbfd; margin-top: 8px; }
    details summary { cursor: pointer; padding: 8px 10px; color: var(--text); font-weight: 650; }
    details > pre, details > .details-body { border: 0; border-top: 1px solid var(--line); border-radius: 0 0 8px 8px; }
    .gallery {
      margin-top: 10px;
      margin-bottom: 10px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
      gap: 8px;
    }
    .card {
      background: var(--panel);
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 8px;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,.035), 0 7px 20px rgba(0,0,0,.025);
      transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
    }
    .card:hover { border-color: #c7ddf5; box-shadow: 0 4px 18px rgba(0, 86, 180, .08); transform: translateY(-1px); }
    .card.active { border-color: #82baf2; box-shadow: 0 0 0 3px var(--accent-soft), 0 5px 18px rgba(0, 86, 180, .08); }
    .card-select {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      width: 100%;
      margin-top: 7px;
      padding: 5px 3px 2px;
      border: 0;
      background: transparent;
      text-align: left;
    }
    .card-select:hover, .card-select.active { border: 0; background: transparent; }
    .card-avatar, .card-avatar img { width: 30px; height: 30px; border-radius: 7px; }
    .card-avatar { display: grid; place-items: center; overflow: hidden; background: var(--soft); color: var(--muted); font-size: 10px; }
    .card-avatar img { display: block; object-fit: cover; }
    .card-copy { min-width: 0; }
    .thumbs { position: relative; }
    .thumbs img { width: 100%; aspect-ratio: 1 / 1; object-fit: contain; background: var(--soft); border-radius: 6px; border: 1px solid var(--line); }
    .thumbs > .preview-button { width: 100%; aspect-ratio: 1 / 1; border-radius: 6px; }
    .thumbs > .preview-button img { border: 0; border-radius: 6px; }
    .mini-thumb { position: absolute; right: 5px; bottom: 5px; width: 34%; background: var(--panel); border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
    .mini-thumb img { display: block; border-radius: 6px; }
    .gallery-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 8px; }
    .gallery-heading h2 { margin: 0; font-size: 16px; }
    .gallery-heading p { margin: 0; color: var(--muted); font-size: 12px; }
    .gallery-controls {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      min-width: min(560px, 52vw);
    }

      return `<div class="developer-stack">
        <details open><summary>${t('Prompt 与 Negative', 'Prompts & negatives')}</summary><div class="details-body">${renderPrompts(item)}</div></details>
        <details><summary>${t('安全 Payload 摘要', 'Safe payload summary')}</summary><div class="details-body">${renderPayloads(item)}</div></details>
        <details><summary>${t('完整 Routing Trace', 'Full routing trace')}</summary><pre>${escapeHtml(JSON.stringify(item.route.trace_excerpt, null, 2))}</pre></details>
        <details><summary>${t('生成状态与 Debug Card', 'Generation status & debug card')}</summary><div class="details-body">
          ${kv([
            [t('状态', 'Status'), statusLabel(item.handheld.status)],
            [t('生成模式', 'Generation mode'), outputModeLabel(item.handheld.prompt_flow)],
            [t('背景模板', 'Scene template'), item.handheld.scene_template],
            ['Provider', item.handheld.provider],
            [t('主 Run 错误', 'Main run error'), item.handheld.main_error],
            [t('重试来源', 'Retry source'), item.handheld.retry_source],
            ['clean_raw_response', item.payloads.clean_raw_response_path],
            ['handheld_raw_response', item.payloads.handheld_raw_response_path],
          ])}
          <pre>${escapeHtml(item.debug_card_excerpt || t('缺失', 'Missing'))}</pre>
        </div></details>
        ${item.video?.prompt ? `<details><summary>${t('视频 Prompt', 'Video prompt')}</summary><pre>${escapeHtml(item.video.prompt)}</pre></details>` : ''}
      </div>`;
    }
    function renderContractDrawer() {
      document.getElementById('contractSubtitle').textContent = t('设计工作流唯一接受的 Design Slots 字段契约。', 'The Design Slots field contract exclusively accepted by the design workflow.');
      document.getElementById('contractClose').textContent = t('关闭', 'Close');
      document.getElementById('contractBody').innerHTML = (data.field_contract || []).map((field) => `<article class="contract-card">
        <h3><code>${escapeHtml(field.field)}</code> ${badge(field.required ? t('必填', 'Required') : t('可选', 'Optional'), field.required ? 'ok' : 'soft')}</h3>
        ${kv([[t('类型', 'Type'), field.type], [t('交付方', 'Delivered by'), field.owner], [t('Fallback', 'Fallback'), uiLang === 'zh' ? (field.fallback_zh || field.fallback) : field.fallback], [t('下游消费者', 'Downstream consumers'), uiLang === 'zh' ? (field.consumers_zh || field.consumers) : field.consumers], [t('示例', 'Example'), field.example]])}
      </article>`).join('');
    }
    let contractReturnFocus = null;
    let lightboxReturnFocus = null;
    async function copyText(value) {
      const text = value || '';
      try {
        if (!navigator.clipboard?.writeText) throw new Error('Clipboard API unavailable');
        await navigator.clipboard.writeText(text);
      } catch (error) {
        const area = document.createElement('textarea');
        area.value = text;
        area.setAttribute('readonly', '');
        area.style.position = 'fixed';
        area.style.opacity = '0';
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        area.remove();
      }
    }
    function updateModalScrollLock() {
      const anyOpen = document.getElementById('contractDrawer').classList.contains('open') || document.getElementById('lightbox').classList.contains('open');
      document.body.classList.toggle('modal-open', anyOpen);
    }
    function trapDialogFocus(event, container) {
      if (event.key !== 'Tab' || !container) return;
      const focusable = Array.from(container.querySelectorAll('button, [href], [tabindex]:not([tabindex="-1"])')).filter((element) => !element.disabled && element.getClientRects().length);
      if (!focusable.length) { event.preventDefault(); container.focus(); return; }
      const first = focusable[0], last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
    }
    function openContractDrawer() {
      renderContractDrawer();
      const drawer = document.getElementById('contractDrawer');
      contractReturnFocus = document.activeElement;
      drawer.inert = false;
      drawer.classList.add('open');
      document.getElementById('contractBackdrop').classList.add('open');
      drawer.setAttribute('aria-hidden', 'false');
      document.getElementById('contractBackdrop').setAttribute('aria-hidden', 'false');
      updateModalScrollLock();
      document.getElementById('contractClose').focus();
    }
    function closeContractDrawer() {
      const drawer = document.getElementById('contractDrawer');
      if (!drawer.classList.contains('open')) return;
      drawer.classList.remove('open');
      document.getElementById('contractBackdrop').classList.remove('open');
      drawer.setAttribute('aria-hidden', 'true');
      drawer.inert = true;
      document.getElementById('contractBackdrop').setAttribute('aria-hidden', 'true');
      updateModalScrollLock();
      if (contractReturnFocus?.focus) contractReturnFocus.focus();
      contractReturnFocus = null;
    }
    function downloadCurrentNode() {
      const item = data.items[selectedIndex];
      const payload = { viewer_data_version: data.viewer_data_version, anchor_id: item.anchor_id, node: selectedNode, data: item.lineage?.[selectedNode] || {} };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `${item.anchor_id || item.row_id}_${selectedNode}.json`;
      link.click();
      URL.revokeObjectURL(url);
    }
    function wireLineageActions() {
      document.querySelectorAll('[data-copy-lineage]').forEach((button) => button.addEventListener('click', async () => {
        const node = data.items[selectedIndex].lineage?.prompt_compile || {};
        const branch = button.dataset.copyLineage === 'planb' ? node.planb : node.mainline;
        await copyText(branch?.prompt || '');
        const original = button.textContent;
        button.textContent = t('已复制', 'Copied');
        setTimeout(() => { button.textContent = original; }, 900);
      }));
    }
    function wireCopyButtons() {
      document.querySelectorAll('[data-copy]').forEach((button) => {
        button.addEventListener('click', async () => {
          const item = data.items[selectedIndex];
          const map = {
            clean: item.prompts.clean,
            cleanNeg: item.prompts.clean_negative,
            handheld: item.prompts.handheld,
            handheldNeg: item.prompts.handheld_negative,
          };
          const variantIndex = Number(button.dataset.variantIndex || 0);
          const variant = (item.variants || [])[variantIndex] || {};
          const value = button.dataset.copy === 'variantPrompt'
            ? variant.prompt
            : button.dataset.copy === 'variantNegative'
            ? variant.negative_prompt
            : map[button.dataset.copy];
          await copyText(value || '');
          const original = button.dataset.label || button.textContent;
          button.textContent = t('已复制', 'Copied');
          setTimeout(() => { button.textContent = original; }, 900);
        });
      });
    }
    function wirePreviewButtons() {
      document.querySelectorAll('[data-preview-src]').forEach((button) => {
        if (button.dataset.previewBound === '1') return;
        button.dataset.previewBound = '1';
        button.addEventListener('click', (event) => {
          event.stopPropagation();
          openLightbox(button.dataset.previewSrc || '', button.dataset.previewTitle || '');
        });
      });
    }
    function openLightbox(src, title) {
      if (!src) return;
      const lightbox = document.getElementById('lightbox');
      document.getElementById('lightboxImage').src = src;
      document.getElementById('lightboxImage').alt = title;
      document.getElementById('lightboxTitle').textContent = title;
      lightboxReturnFocus = document.activeElement;
      lightbox.classList.add('open');
      lightbox.setAttribute('aria-hidden', 'false');
      updateModalScrollLock();
      document.getElementById('lightboxClose').focus();
    }
    function closeLightbox() {
      const lightbox = document.getElementById('lightbox');
      if (!lightbox.classList.contains('open')) return;
      lightbox.classList.remove('open');
      lightbox.setAttribute('aria-hidden', 'true');
      document.getElementById('lightboxImage').src = '';
      updateModalScrollLock();
      if (lightboxReturnFocus?.focus) lightboxReturnFocus.focus();
      lightboxReturnFocus = null;
    }
    document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
    document.getElementById('lightbox').addEventListener('click', (event) => {
      if (event.target.id === 'lightbox') closeLightbox();
    });
    document.getElementById('contractClose').addEventListener('click', closeContractDrawer);
    document.getElementById('contractBackdrop').addEventListener('click', closeContractDrawer);
    document.addEventListener('keydown', (event) => {
      const lightbox = document.getElementById('lightbox');
      const drawer = document.getElementById('contractDrawer');
      if (event.key === 'Escape') { if (lightbox.classList.contains('open')) closeLightbox(); else closeContractDrawer(); }
      else if (lightbox.classList.contains('open')) trapDialogFocus(event, lightbox);
      else if (drawer.classList.contains('open')) trapDialogFocus(event, drawer);
    });
    function renderReviewChrome() {
      document.documentElement.lang = uiLang === 'zh' ? 'zh-CN' : 'en';
      document.getElementById('pageTitle').textContent = 'Community Gift Review';
      document.getElementById('pageSubtitle').textContent = t('先审核主线与 PlanB，再沿 Pak JSON → Design Slots → Creative LLM → Routing & Prompt → Image 查看真实记录。', 'Review the mainline and PlanB first, then inspect the actual Pak JSON → Design Slots → Creative LLM → Routing & Prompt → Image record.');
      document.querySelector('.gallery-heading h2').textContent = t('礼物选择', 'Gift Selection');
      document.querySelector('.gallery-heading p').textContent = t('选择主播，查看礼物资产和完整生成记录。', 'Select a creator to review gift assets and the complete generation record.');
      document.getElementById('pagedMode').textContent = t('每页 10 个', '10 per page');
      document.getElementById('allMode').textContent = t('全部展开', 'Show all');
      document.getElementById('reviewTabLabel').textContent = t('结果审核台', 'Review');
      document.getElementById('showcaseLink').textContent = t('礼物预览', 'Gift Preview');
      document.getElementById('workflowLink').textContent = t('工作流画布', 'Workflow');
      document.getElementById('lightboxClose').textContent = t('关闭', 'Close');
      document.querySelectorAll('[data-review-lang]').forEach((button) => {
        const active = button.dataset.reviewLang === uiLang;
        button.classList.toggle('active', active);
        button.setAttribute('aria-pressed', String(active));
      });
    }
    function renderAll() {
      const anchorId = String(data.items[selectedIndex]?.viewer_anchor_id || data.items[selectedIndex]?.anchor_id || '');
      syncSelectionUrl();
      document.getElementById('showcaseLink').href = linkedViewerHref(showcaseBaseHref, anchorId);
      document.getElementById('workflowLink').href = linkedViewerHref(workflowBaseHref, anchorId);
      renderReviewChrome();
      renderSummary();
      renderTimeline();
      renderDetail();
      renderGallery();
    }
    document.querySelectorAll('[data-review-lang]').forEach((button) => button.addEventListener('click', () => { uiLang = button.dataset.reviewLang; renderAll(); }));
    document.getElementById('contractOpen').addEventListener('click', openContractDrawer);
    renderAll();
  </script>
</body>
</html>
