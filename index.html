<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Community Gift Preview</title>
  <style>
    :root { color-scheme: light; --bg:#f5f5f7; --panel:#fff; --soft:#fafafa; --text:#1d1d1f; --muted:#6e6e73; --tertiary:#86868b; --line:#e8e8ed; --accent:#0071e3; --accent-soft:#eaf3ff; --green:#248a3d; --amber:#ad6200; --red:#b42318; }
    * { box-sizing:border-box; }
    html { background:var(--bg); scroll-behavior:smooth; }
    body { margin:0; color:var(--text); background:var(--bg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased; }
    body.modal-open { overflow:hidden; }
    button { font:inherit; }
    button:focus-visible,a:focus-visible,summary:focus-visible { outline:3px solid rgba(0,113,227,.24); outline-offset:2px; }
    .page { --motion-direction:1; max-width:1720px; margin:0 auto; padding:18px 24px 48px; animation:page-soft-enter .42s cubic-bezier(.22,.8,.3,1) both; }
    .topbar { min-height:82px; display:flex; align-items:flex-start; justify-content:space-between; gap:24px; padding-bottom:14px; border-bottom:1px solid var(--line); }
    .brand { min-width:0; }
    .brand h1 { margin:0 0 4px; font-size:24px; line-height:1.25; font-weight:680; }
    .brand p { margin:0; max-width:760px; color:var(--muted); font-size:12px; }
    .top-actions { display:flex; flex-wrap:wrap; justify-content:flex-end; align-items:center; gap:9px; }
    .view-tabs,.lang-switch { display:inline-flex; align-items:center; gap:2px; padding:3px; border:1px solid #e2e4e8; border-radius:10px; background:#eef0f3; }
    .view-tab,.lang-button { display:inline-flex; align-items:center; justify-content:center; min-height:30px; padding:5px 10px; border:0; border-radius:7px; color:#5f6369; background:transparent; font-size:12px; font-weight:600; line-height:1; text-decoration:none; white-space:nowrap; cursor:pointer; transition:color .18s ease,background-color .18s ease,box-shadow .2s ease,transform .22s cubic-bezier(.2,.8,.2,1); }
    .view-tab:hover,.lang-button:hover { color:var(--text); background:rgba(255,255,255,.68); }
    .view-tab.active,.lang-button.active { color:#075ea9; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.07),0 0 0 1px rgba(0,113,227,.08); }
    .view-tab:active,.lang-button:active { transform:translateY(1px) scale(.975); }
    .lang-button.control-arrive { animation:control-slide-in .25s cubic-bezier(.2,.85,.25,1) both; }
    .selector-head { display:flex; align-items:flex-end; justify-content:flex-end; gap:20px; margin:20px 2px 10px; }
    .selector-head h2,.section-title h2 { margin:0; font-size:17px; }
    .selector-head p,.section-title p { margin:2px 0 0; color:var(--muted); font-size:12px; }
    .gallery-controls { min-height:48px; display:flex; align-items:flex-start; justify-content:flex-end; gap:10px; }
    .gift-search { width:180px; }
    .gift-search input { width:100%; min-height:33px; padding:6px 10px; border:1px solid #e2e4e8; border-radius:8px; color:var(--text); background:rgba(255,255,255,.86); font-size:11px; outline:0; transition:border-color .18s ease,box-shadow .18s ease,background-color .18s ease; }
    .gift-search input::placeholder { color:var(--tertiary); }
    .gift-search input:focus { border-color:#9ecbfa; background:#fff; box-shadow:0 0 0 3px rgba(0,113,227,.08); }
    .strength-sort { position:relative; flex:0 0 auto; }
    .strength-sort::after { content:"⌄"; position:absolute; top:50%; right:9px; transform:translateY(-56%); color:var(--tertiary); font-size:12px; pointer-events:none; }
    .strength-sort select { min-height:33px; padding:6px 26px 6px 10px; border:1px solid #e2e4e8; border-radius:8px; color:var(--text); background:#fff; font-size:11px; outline:0; appearance:none; cursor:pointer; transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease; }
    .strength-sort select:hover { border-color:#b7d8fb; }
    .strength-sort select:focus { border-color:#9ecbfa; box-shadow:0 0 0 3px rgba(0,113,227,.08); }
    .strength-sort select:active { transform:translateY(1px); }
    .mode-toggle { display:inline-flex; padding:2px; border-radius:8px; background:#eceef1; }
    .mode-toggle button { min-height:29px; padding:4px 9px; border:0; border-radius:6px; color:var(--muted); background:transparent; font-size:11px; cursor:pointer; transition:color .18s ease,background-color .18s ease,box-shadow .2s ease,transform .22s cubic-bezier(.2,.8,.2,1); }
    .mode-toggle button[aria-pressed="true"] { color:var(--text); background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.06); }
    .mode-toggle button:active { transform:translateY(1px) scale(.97); }
    .mode-toggle button.control-arrive { animation:control-slide-in .25s cubic-bezier(.2,.85,.25,1) both; }
    .pager-wrap { min-width:190px; min-height:48px; text-align:right; }
    .pager { min-height:30px; display:flex; justify-content:flex-end; gap:6px; }
    .pager button { width:30px; height:30px; padding:0; border:0; border-radius:50%; color:var(--text); background:#fff; cursor:pointer; transition:color .18s ease,background-color .18s ease,box-shadow .2s ease,transform .22s cubic-bezier(.2,.8,.2,1); }
    .pager button:hover { transform:translateY(-1px); box-shadow:0 4px 12px rgba(0,0,0,.07); }
    .pager button:active { transform:translateY(1px) scale(.94); }
    .pager button[aria-current="page"] { color:#fff; background:var(--accent); animation:pager-slide-in .26s cubic-bezier(.2,.85,.25,1) both; }
    .range { min-height:15px; margin-top:3px; color:var(--tertiary); font-size:10px; }
    .gift-gallery { display:grid; grid-template-columns:repeat(10,minmax(0,1fr)); gap:8px; }
    .gift-card { min-width:0; padding:8px; border:1px solid transparent; border-radius:11px; background:var(--panel); text-align:left; cursor:pointer; box-shadow:0 1px 2px rgba(0,0,0,.025); transition:border-color .18s ease,box-shadow .2s ease,transform .22s cubic-bezier(.2,.8,.2,1); }
    .gift-card:hover { border-color:#b7d8fb; }
    .gift-card:active { transform:translateY(1px) scale(.985); }
    .gift-card.active { border-color:#63aaf2; box-shadow:0 0 0 2px rgba(0,113,227,.08); animation:card-soft-select .28s cubic-bezier(.2,.85,.25,1) both; }
    .gift-thumb { position:relative; width:100%; aspect-ratio:1; display:grid; place-items:center; overflow:hidden; border-radius:8px; background:var(--soft); }
    .gift-thumb img { width:100%; height:100%; object-fit:contain; transform:scale(1); transition:transform .26s cubic-bezier(.2,.8,.2,1); }
    .gift-card:hover .gift-thumb img { transform:scale(1.08); }
    .gift-fallback { width:38%; aspect-ratio:1; overflow:hidden; border-radius:50%; background:#e8e8ed; }
    .gift-fallback img { width:100%; height:100%; object-fit:cover; }
    .gift-search-empty { grid-column:1 / -1; padding:34px 16px; border:1px dashed #dfe2e7; border-radius:11px; color:var(--tertiary); background:rgba(255,255,255,.45); font-size:12px; text-align:center; }
    .gift-gallery,.content { transition:opacity .14s ease,transform .2s cubic-bezier(.22,.8,.3,1); }
    .page.content-leave .content,.page.content-leave:not(.detail-only) .gift-gallery { opacity:0; transform:translateY(calc(var(--motion-direction) * -5px)); }
    .page.content-enter .content,.page.content-enter:not(.detail-only) .gift-gallery { opacity:0; transform:translateY(calc(var(--motion-direction) * 5px)); }
    .content { margin-top:12px; }
    .creator-profile { padding:20px; border-radius:14px; background:var(--panel); box-shadow:0 1px 2px rgba(0,0,0,.035),0 12px 38px rgba(0,0,0,.025); }
    .creator-profile-head { display:grid; grid-template-columns:88px minmax(0,1fr) auto; align-items:start; gap:18px; }
    .creator-avatar { width:88px; height:88px; align-self:end; display:grid; place-items:center; overflow:hidden; border-radius:22px; background:var(--soft); color:var(--tertiary); font-size:12px; }
    .creator-avatar img { width:100%; height:100%; object-fit:cover; }
    .creator-avatar button { width:100%; height:100%; padding:0; border:0; background:transparent; cursor:zoom-in; }
    .creator-copy h2 { margin:1px 0 3px; font-size:25px; line-height:1.2; }
    .creator-meta { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
    .fan-club { color:var(--accent); font-size:12px; font-weight:650; }
    .brand-strength { display:inline-flex; align-items:center; gap:6px; padding:3px 7px; border:1px solid var(--line); border-radius:999px; color:var(--muted); background:var(--soft); font-size:10px; font-weight:600; white-space:nowrap; }
    .brand-strength i { width:7px; height:7px; border-radius:50%; background:#8e8e93; box-shadow:0 0 0 2px rgba(142,142,147,.12); }
    .brand-strength[data-strength="weak"] i { background:#ff3b30; box-shadow:0 0 0 2px rgba(255,59,48,.12); }
    .brand-strength[data-strength="medium"] i { background:#e7a000; box-shadow:0 0 0 2px rgba(231,160,0,.13); }
    .brand-strength[data-strength="strong"] i { background:#0a84ff; box-shadow:0 0 0 2px rgba(10,132,255,.12); }
    .brand-strength[data-strength="exceptional"] i { background:#34c759; box-shadow:0 0 0 2px rgba(52,199,89,.12); }
    .creator-intro { max-width:1080px; margin:10px 0 0; color:var(--muted); font-size:13px; line-height:1.65; }
    .profile-anchor { min-width:280px; align-self:end; display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-top:0; padding:11px 13px; border:1px solid var(--line); border-radius:10px; background:var(--soft); }
    .profile-anchor-copy { min-width:0; }
    .profile-anchor span { display:block; margin-bottom:4px; color:var(--tertiary); font-size:9px; font-weight:650; letter-spacing:.06em; text-transform:uppercase; }
    .profile-anchor strong { display:block; overflow-wrap:anywhere; color:var(--text); font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:12px; font-weight:650; }
    .anchor-copy { flex:0 0 auto; padding:6px 9px; border:1px solid var(--line); border-radius:7px; color:var(--accent); background:var(--panel); font-size:10px; font-weight:650; cursor:pointer; }
    .anchor-copy:hover { border-color:var(--accent); }
    .anchor-copy.copied { color:#fff; border-color:var(--green); background:var(--green); }
    .profile-grid { display:grid; grid-template-columns:minmax(0,1.12fr) minmax(420px,.88fr); align-items:stretch; min-height:427px; gap:14px; margin-top:18px; }
    .profile-block { min-width:0; height:100%; padding:16px; border:1px solid var(--line); border-radius:12px; background:var(--soft); }
    .profile-column { min-width:0; display:flex; flex-direction:column; gap:12px; }
    .profile-column.visual { grid-column:1; grid-row:1; }
    .profile-column:not(.visual) { grid-column:2; grid-row:1; }
    .profile-column > .profile-block { flex:1 1 0; }
    .profile-column.visual > .profile-block:first-child { flex:0 0 190px; }
    .profile-column:not(.visual) > .profile-block { min-height:auto; display:flex; flex-direction:column; overflow:visible; padding:11px 14px; }
    .profile-column:not(.visual) > .profile-block .profile-block-head { margin-bottom:0; }
    .profile-column:not(.visual) > .profile-block .tokens { margin-top:7px; }
    .profile-column:not(.visual) > .profile-block .token { padding:5px 8px; font-size:10px; }
    .profile-column:not(.visual) > .profile-block > p { display:block; margin:10px 0 0; padding:0; overflow:visible; font-size:12px; line-height:1.5; }
    .profile-block-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:10px; }
    .profile-block h3 { margin:0; font-size:14px; }
    .profile-block-head p { margin:3px 0 0; color:var(--tertiary); font-size:10px; }
    .profile-block > p { margin:12px 0 0; color:var(--muted); font-size:13px; line-height:1.65; }
    .empty-copy { color:var(--tertiary)!important; font-style:italic; }
    .section-title { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin:24px 2px 10px; }
    .solutions { display:grid; grid-template-columns:minmax(0,4fr) minmax(280px,1fr); align-items:start; gap:16px; margin-top:12px; }
    .solution { min-width:0; padding:16px; border-radius:12px; background:var(--panel); box-shadow:0 1px 2px rgba(0,0,0,.03); }
    .solution.mainline { padding:20px; box-shadow:0 5px 18px rgba(0,0,0,.05); }
    .solution.planb { background:var(--soft); box-shadow:inset 0 0 0 1px var(--line); }
    .solution-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .solution-head h3 { margin:0; font-size:16px; }
    .solution-head p { margin:2px 0 0; color:var(--muted); font-size:11px; }
    .status { display:inline-flex; align-items:center; gap:5px; color:var(--muted); font-size:10px; white-space:nowrap; }
    .dot { width:6px; height:6px; border-radius:50%; background:#b7b7bc; }
    .dot.ok { background:var(--green); }.dot.warn { background:var(--amber); }.dot.fail { background:var(--red); }
    .mainline-media { display:grid; grid-template-columns:minmax(220px,.58fr) minmax(300px,1fr) minmax(260px,.863fr); align-items:start; gap:14px; }
    .media { min-width:0; margin:0; }
    .mainline-media .media-frame { position:relative; width:100%; height:auto; display:grid; place-items:center; overflow:hidden; border-radius:10px; background:#f4f4f6; box-shadow:inset 0 0 0 1px rgba(0,0,0,.045); }
    .mainline-media .media.video .media-frame { aspect-ratio:780 / 1688; background:#151516; }
    .mainline-media .media.icon .media-frame { aspect-ratio:1 / 1; }
    .mainline-media .media.panel .media-frame { aspect-ratio:780 / 904; background:#292929; }
    .media-frame img,.media-frame video { display:block; width:100%; height:100%; object-fit:contain; }
    .media-frame button { width:100%; height:100%; padding:0; border:0; background:transparent; cursor:zoom-in; }
    .media-frame .media-expand { position:absolute; z-index:2; top:8px; right:8px; width:auto; height:auto; padding:5px 8px; border:1px solid rgba(255,255,255,.28); border-radius:7px; color:#fff; background:rgba(0,0,0,.58); font-size:10px; line-height:1.2; cursor:zoom-in; backdrop-filter:blur(8px); }
    .media-empty { padding:20px; color:var(--tertiary); font-size:12px; text-align:center; }
    .media figcaption { display:flex; align-items:center; justify-content:space-between; gap:8px; padding-top:7px; color:var(--muted); font-size:10px; }
    .icon-strip { display:grid; grid-template-columns:92px minmax(0,1fr); align-items:center; gap:12px; margin-top:10px; padding:10px; border-radius:10px; background:var(--soft); }
    .icon-frame { width:92px; aspect-ratio:1; display:grid; place-items:center; overflow:hidden; border-radius:9px; background:#fff; }
    .icon-frame img { width:100%; height:100%; object-fit:contain; }
    .icon-frame button { width:100%; height:100%; padding:0; border:0; background:transparent; cursor:zoom-in; }
    .icon-copy strong { display:block; font-size:12px; }.icon-copy span { color:var(--muted); font-size:11px; }
    .planb-icon { display:grid; gap:12px; }
    .planb-icon-frame { width:min(100%,280px); aspect-ratio:1; display:grid; place-items:center; overflow:hidden; margin:0 auto; border-radius:11px; background:#fff; }
    .planb-icon-frame img { width:100%; height:100%; object-fit:contain; }
    .planb-icon-frame button { width:100%; height:100%; padding:0; border:0; background:transparent; cursor:zoom-in; }
    .planb-copy { padding:0 2px 2px; }
    .planb-copy strong { display:block; font-size:12px; }
    .planb-copy p { margin:5px 0 0; color:var(--muted); font-size:11px; }
    .tokens { display:flex; flex-wrap:wrap; gap:7px; }
    .token { display:inline-flex; align-items:center; gap:6px; padding:6px 9px; border-radius:999px; background:var(--soft); color:var(--text); font-size:11px; }
    .swatch { width:13px; height:13px; border:1px solid rgba(0,0,0,.08); border-radius:50%; background:var(--swatch,#d2d2d7); }
    .profile-block .token { background:var(--panel); }
    .profile-sticker-grid { display:grid; grid-template-rows:96px; grid-auto-flow:column; grid-auto-columns:96px; gap:8px; overflow-x:auto; padding:1px 1px 8px; scroll-snap-type:x proximity; }
    .sticker { width:100%; aspect-ratio:1; padding:0; overflow:hidden; border:0; border-radius:10px; background:var(--panel); cursor:zoom-in; scroll-snap-align:start; }
    .sticker img { width:100%; height:100%; object-fit:contain; }
    .sticker-empty { padding:18px; border-radius:12px; color:var(--tertiary); background:var(--panel); font-size:12px; }
    .room-frames { display:grid; grid-template-columns:repeat(2,96px); justify-content:start; gap:10px; }
    .room-frame,.room-frame-placeholder { position:relative; min-width:0; aspect-ratio:9 / 16; overflow:hidden; border:1px solid rgba(0,0,0,.055); border-radius:12px; background:linear-gradient(160deg,#e8e9ee 0%,#f8f8fa 48%,#e2e4ea 100%); }
    .room-frame { padding:0; cursor:zoom-in; }
    .room-frame img { width:100%; height:100%; object-fit:contain; background:#111318; }
    .room-frame-placeholder { display:grid; place-items:center; align-content:center; gap:7px; padding:18px; color:var(--tertiary); text-align:center; }
    .room-frame-placeholder::before { content:""; position:absolute; inset:10px; border:1px solid rgba(0,0,0,.08); border-radius:9px; }
    .room-frame-placeholder strong { position:relative; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; color:var(--muted); font-size:13px; }
    .room-frame-placeholder small { position:relative; font-size:10px; line-height:1.45; }
    .lightbox { position:fixed; inset:0; z-index:50; display:none; place-items:center; padding:24px; background:rgba(0,0,0,.78); }
    .lightbox.open { display:grid; }
    .lightbox-panel { width:min(900px,94vw); max-height:92vh; display:grid; grid-template-rows:auto minmax(0,1fr); overflow:hidden; border-radius:12px; background:#151516; }
    .lightbox-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 12px; color:#fff; }
    .lightbox-head button { border:0; border-radius:7px; padding:6px 10px; color:#fff; background:#333; cursor:pointer; }
    .lightbox-body { min-height:0; display:grid; place-items:center; padding:0 12px 12px; }
    .lightbox-body img,.lightbox-body video { max-width:100%; max-height:82vh; object-fit:contain; }
    .lightbox-body video { width:min(560px,100%); }
    .lightbox-body [hidden] { display:none; }
    @keyframes page-soft-enter { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:none; } }
    @keyframes control-slide-in { from { opacity:.65; transform:translateY(calc(var(--control-direction,1) * 4px)) scale(.98); } to { opacity:1; transform:none; } }
    @keyframes pager-slide-in { from { transform:translateY(calc(var(--motion-direction) * 4px)) scale(.94); } to { transform:none; } }
    @keyframes card-soft-select { 0% { transform:translateY(2px) scale(.985); } 100% { transform:none; } }
    @media (prefers-reduced-motion:reduce) {
      html { scroll-behavior:auto; }
      .page,.view-tab,.lang-button,.mode-toggle button,.pager button,.pager button[aria-current="page"],.gift-card,.gift-card.active,.gift-gallery,.content { animation:none!important; transition:none!important; }
      .page.content-leave .gift-gallery,.page.content-leave .content,.page.content-enter .gift-gallery,.page.content-enter .content { opacity:1; transform:none; }
    }
    @media (max-width:1200px) { .gift-gallery { grid-template-columns:repeat(5,minmax(0,1fr)); }.solutions { grid-template-columns:1fr; }.solution { max-width:none; }.solution.planb { width:min(100%,420px); }.creator-profile-head { grid-template-columns:88px minmax(0,1fr); }.profile-anchor { grid-column:2; width:min(100%,320px); }.profile-grid { grid-template-columns:minmax(0,1fr) minmax(360px,.8fr); } }
    @media (max-width:900px) { .mainline-media { grid-template-columns:1fr; gap:14px; }.mainline-media .media { width:100%; margin:0 auto; }.mainline-media .media.video { max-width:400px; }.mainline-media .media.icon { max-width:520px; }.mainline-media .media.panel { max-width:460px; }.creator-profile-head { grid-template-columns:72px minmax(0,1fr); }.profile-anchor { grid-column:2; }.profile-grid { grid-template-columns:1fr; min-height:0; }.profile-column.visual { grid-column:1; grid-row:1; }.profile-column:not(.visual) { grid-column:1; grid-row:2; }.profile-column > .profile-block,.profile-column.visual > .profile-block:first-child { flex-basis:auto; }.profile-column:not(.visual) > .profile-block { padding:14px; }.profile-sticker-grid { grid-template-rows:88px; grid-auto-columns:88px; }.room-frames { grid-template-columns:repeat(2,92px); } }
    @media (max-width:720px) { .page { padding:12px 12px 32px; }.topbar,.selector-head { align-items:flex-start; flex-direction:column; }.top-actions { justify-content:flex-start; }.gallery-controls { width:100%; flex-wrap:wrap; justify-content:space-between; }.gift-search { width:100%; }.gift-search input { min-height:40px; font-size:12px; }.pager-wrap { min-width:0; }.pager { min-height:38px; }.pager button { width:38px; height:38px; }.mode-toggle button { min-height:38px; padding-inline:12px; }.gift-gallery { grid-template-columns:repeat(2,minmax(0,1fr)); }.creator-profile { padding:15px; }.creator-profile-head { grid-template-columns:64px minmax(0,1fr); gap:12px; }.creator-avatar { width:64px; height:64px; border-radius:16px; }.creator-copy h2 { font-size:20px; }.profile-anchor { grid-column:1 / -1; min-width:0; width:100%; }.profile-grid { margin-top:14px; }.profile-block { padding:14px; }.room-frames { grid-template-columns:repeat(2,88px); }.solution.mainline { padding:15px; }.mainline-media .media figcaption { font-size:10px; }.media-frame .media-expand { top:5px; right:5px; padding:5px 7px; font-size:10px; }.view-tab,.lang-button { min-height:40px; padding:7px 10px; } }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand"><h1 id="pageTitle">Community Gift Preview</h1><p id="pageSubtitle"></p></div>
      <div class="top-actions">

  <script>

    function filteredItems(){const query=searchTerm.trim().toLocaleLowerCase(),filtered=query?data.items.filter(item=>{const row=String(item.row_id??''),rowPadded=row.padStart(3,'0');return [item.host_name,item.community_name,item.fan_club_name,item.source_anchor_id,item.anchor_id,row,`#${row}`,`row${row}`,`row${rowPadded}`].some(value=>String(value??'').toLocaleLowerCase().includes(query));}):data.items;if(strengthSort==='natural')return filtered;const rank={unknown:-1,weak:0,medium:1,strong:2,exceptional:3},direction=strengthSort==='ascending'?1:-1;return [...filtered].sort((a,b)=>direction*((rank[brandStrength(a)]??-1)-(rank[brandStrength(b)]??-1))||data.items.indexOf(a)-data.items.indexOf(b));}

    function renderPager(filtered=filteredItems()){const total=Math.max(1,Math.ceil(filtered.length/pageSize)),start=filtered.length?(galleryMode==='all'?1:currentPage*pageSize+1):0,end=galleryMode==='all'?filtered.length:Math.min(filtered.length,(currentPage+1)*pageSize);document.getElementById('pager').innerHTML=galleryMode==='all'||!filtered.length?'':Array.from({length:total},(_,index)=>`<button type="button" data-page="${index}" aria-current="${index===currentPage?'page':'false'}">${index+1}</button>`).join('');document.getElementById('galleryRange').textContent=searchTerm?t(`${filtered.length} 个结果`,`${filtered.length} results`):(filtered.length?t(`当前 ${start}-${end} / ${filtered.length}`,`${start}-${end} of ${filtered.length}`):t('暂无礼物','No gifts'));document.querySelectorAll('[data-page]').forEach(button=>button.onclick=()=>{const nextPage=Number(button.dataset.page),direction=nextPage>=currentPage?1:-1;currentPage=nextPage;const nextItem=filtered[currentPage*pageSize];if(nextItem)selectedIndex=data.items.indexOf(nextItem);renderWithMotion(direction);});}
    function renderContent(){

      document.getElementById('content').innerHTML=`
        <section class="creator-profile">

    function wireAnchorCopy(){
      document.querySelectorAll('[data-copy-anchor]').forEach(button=>{
        button.onclick=async()=>{
          const value=button.dataset.copyAnchor||'';
          let copied=false;
          try{
            if(navigator.clipboard?.writeText){
              await navigator.clipboard.writeText(value);
              copied=true;
            }
          }catch(error){}
          if(!copied){
            const helper=document.createElement('textarea');
            helper.value=value;
            helper.setAttribute('readonly','');
            helper.style.position='fixed';
            helper.style.opacity='0';
            document.body.appendChild(helper);
            helper.select();
            try{copied=document.execCommand('copy');}catch(error){copied=false;}
            helper.remove();
          }
          button.textContent=t(copied?'已复制':'复制失败',copied?'Copied':'Copy failed');
          button.classList.toggle('copied',copied);
          window.setTimeout(()=>{
            if(button.isConnected){
              button.textContent=t('复制','Copy');
              button.classList.remove('copied');
            }
          },1600);
        };
      });
    }
    function renderChrome(){document.documentElement.lang=uiLang==='zh'?'zh-CN':'en';document.getElementById('pageTitle').textContent=t('Community Gifts · 礼物预览','Community Gifts · Gift Preview');document.getElementById('pageSubtitle').textContent=t('为每位主播呈现专属社区礼物与最终动态效果。','A friendly preview of each creator’s community gift and final animation.');document.getElementById('showcaseTab').textContent=t('礼物预览','Gift Preview');document.getElementById('reviewLink').textContent=t('结果审核台','Review');document.getElementById('workflowLink').textContent=t('工作流画布','Workflow');const search=document.getElementById('giftSearch');search.placeholder=t('搜索主播','Search creators');search.setAttribute('aria-label',t('搜索主播','Search creators'));const sort=document.getElementById('strengthSort');sort.setAttribute('aria-label',t('品牌强度排序','Sort by brand strength'));sort.options[0].textContent=t('自然排序','Natural order');sort.options[1].textContent=t('品牌强度：低到高','Brand strength: low to high');sort.options[2].textContent=t('品牌强度：高到低','Brand strength: high to low');document.getElementById('pagedMode').textContent=t('每页 10 个','10 per page');document.getElementById('allMode').textContent=t('全部展开','Show all');document.getElementById('lightboxClose').textContent=t('关闭','Close');document.querySelectorAll('[data-lang]').forEach(button=>{const active=button.dataset.lang===uiLang;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active));});}

    function animateControl(button,direction){button.style.setProperty('--control-direction',direction);button.classList.remove('control-arrive');void button.offsetWidth;button.classList.add('control-arrive');}
    function renderWithMotion(direction=1,detailOnly=false){
      const page=document.querySelector('.page');

      if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){renderer();return;}
      window.clearTimeout(transitionTimer);
      page.style.setProperty('--motion-direction',direction<0?-1:1);

      page.classList.remove('content-enter');

        renderer();

        requestAnimationFrame(()=>requestAnimationFrame(()=>page.classList.remove('content-enter')));
      },120);

    document.getElementById('giftSearch').oninput=event=>{searchTerm=event.target.value;currentPage=searchTerm.trim()?0:Math.floor(selectedIndex/pageSize);renderGallery();};
    document.getElementById('strengthSort').onchange=event=>{strengthSort=event.target.value;const position=filteredItems().indexOf(current());currentPage=position>=0?Math.floor(position/pageSize):0;renderGallery();};
    document.querySelectorAll('[data-lang]').forEach(button=>button.onclick=()=>{const direction=button.dataset.lang==='en'?1:-1;if(button.dataset.lang===uiLang)return;uiLang=button.dataset.lang;animateControl(button,direction);renderWithMotion(direction);});
    document.getElementById('pagedMode').onclick=()=>{if(galleryMode==='paged')return;galleryMode='paged';const position=filteredItems().indexOf(current());currentPage=position>=0?Math.floor(position/pageSize):0;document.getElementById('pagedMode').setAttribute('aria-pressed','true');document.getElementById('allMode').setAttribute('aria-pressed','false');animateControl(document.getElementById('pagedMode'),-1);renderWithMotion(-1);};
    document.getElementById('allMode').onclick=()=>{if(galleryMode==='all')return;galleryMode='all';document.getElementById('pagedMode').setAttribute('aria-pressed','false');document.getElementById('allMode').setAttribute('aria-pressed','true');animateControl(document.getElementById('allMode'),1);renderWithMotion(1);};
    document.getElementById('lightboxClose').onclick=closeLightbox;document.getElementById('lightbox').onclick=event=>{if(event.target.id==='lightbox')closeLightbox();};document.addEventListener('keydown',event=>{if(event.key==='Escape')closeLightbox();});
    renderAll();
  </script>
</body>
</html>
