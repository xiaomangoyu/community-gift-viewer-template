<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Community Gifts · 交付工作流</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f5f5f7;
      --panel: #ffffff;
      --canvas: #f8f9fb;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --tertiary: #86868b;
      --line: #e4e6ea;
      --line-strong: #c8ccd3;
      --blue: #0071e3;
      --blue-soft: #eaf3ff;
      --green: #248a3d;
      --amber: #b56a00;
      --red: #b42318;
      --purple: #7856c6;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      overflow-x: hidden;
      background: var(--page);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    body.modal-open { overflow: hidden; }
    button { font: inherit; color: inherit; }
    button:focus-visible, a:focus-visible, summary:focus-visible { outline: 3px solid rgba(0,113,227,.24); outline-offset: 2px; }
    .page { width: 100%; max-width: 1720px; margin: 0 auto; padding: 18px 24px 40px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 0 2px 14px; border-bottom: 1px solid var(--line); }
    .brand h1 { margin: 0; font-size: 21px; letter-spacing: -.02em; }
    .brand p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .top-actions { display: flex; flex: 0 1 560px; min-width: 0; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 9px; }
    .view-tabs, .lang-switch { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border: 1px solid #e2e4e8; border-radius: 10px; background: #eef0f3; }
    .view-tab, .lang-button { display: inline-flex; align-items: center; justify-content: center; min-height: 30px; padding: 5px 10px; border: 0; border-radius: 7px; color: #5f6369; background: transparent; font-size: 12px; font-weight: 600; line-height: 1; text-decoration: none; white-space: nowrap; cursor: pointer; }
    .view-tab:hover, .lang-button:hover { color: var(--text); background: rgba(255,255,255,.68); }
    .view-tab.active, .lang-button.active { color: #075ea9; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.07), 0 0 0 1px rgba(0,113,227,.08); }
    .utility-button, .plain-button { min-height: 36px; padding: 7px 11px; border: 1px solid #dfe2e7; border-radius: 9px; color: #34373c; background: rgba(255,255,255,.9); font-size: 12px; font-weight: 600; cursor: pointer; }
    .utility-button:hover, .plain-button:hover { border-color: #c9ced6; background: #fff; }
    .business-overview { margin: 12px 0 4px; padding: 11px 14px; border-radius: var(--radius); background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.035), 0 10px 32px rgba(0,0,0,.025); }
    .business-compact { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .business-mainline { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
    .business-kicker { flex: 0 0 auto; color: var(--blue); font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .business-mainline strong { overflow: hidden; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
    .business-facts { display: flex; flex: 0 0 auto; align-items: center; gap: 12px; color: var(--muted); font-size: 11px; white-space: nowrap; }
    .business-fact { display: inline-flex; align-items: center; gap: 5px; }
    .business-note { margin: 5px 0 0; color: var(--muted); font-size: 11px; }
    .gallery-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 8px; }
    .gallery-heading h2 { margin: 0; font-size: 16px; }
    .gallery-heading p { margin: 0; color: var(--muted); font-size: 12px; }
    .gallery-controls { display: grid; grid-template-columns: auto minmax(0,1fr); align-items: center; gap: 8px; min-width: min(620px,56vw); }
    .mode-toggle { display: inline-flex; gap: 6px; justify-content: flex-end; }
    .mode-toggle button, .pager button { min-height: 28px; padding: 5px 8px; border: 1px solid #dfe2e7; border-radius: 9px; background: rgba(255,255,255,.9); font-size: 12px; cursor: pointer; }
    .mode-toggle button:hover, .pager button:hover { border-color: #c9ced6; background: #fff; }
    .mode-toggle button.active { color: #075ea9; border-color: #b9d9fb; background: var(--blue-soft); }
    .pager-wrap { display: grid; gap: 4px; justify-items: end; }
    .pager { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 5px; }
    .pager button { width: 30px; min-width: 30px; height: 30px; padding: 0; border-radius: 50%; line-height: 1; }
    .pager button.active { color: #fff; border-color: var(--blue); background: var(--blue); }
    .range-text { color: var(--muted); font-size: 12px; }
    .gift-gallery { display: grid; grid-template-columns: repeat(auto-fill,minmax(150px,168px)); gap: 8px; margin: 10px 0; }
    .gift-card { min-width: 0; padding: 8px; border: 1px solid transparent; border-radius: 10px; background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.035),0 7px 20px rgba(0,0,0,.025); cursor: pointer; text-align: left; transition: border-color .15s ease,box-shadow .15s ease,transform .15s ease; }
    .gift-card:hover { border-color: #c7ddf5; box-shadow: 0 4px 18px rgba(0,86,180,.08); transform: translateY(-1px); }
    .gift-card.active { border-color: #82baf2; box-shadow: 0 0 0 3px var(--blue-soft),0 5px 18px rgba(0,86,180,.08); }
    .gift-thumbs { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 6px; }
    .gift-thumb { min-width: 0; }
    .gift-thumb img, .gift-thumb-empty { display: grid; place-items: center; width: 100%; aspect-ratio: 1; object-fit: contain; border: 1px solid var(--line); border-radius: 6px; background: #eef0f3; color: var(--muted); font-size: 10px; }
    .gift-thumb span { display: block; margin-top: 3px; overflow: hidden; color: var(--muted); font-size: 10px; text-align: center; text-overflow: ellipsis; white-space: nowrap; }
    .gift-card-title { min-height: 34px; margin: 7px 0 3px; overflow: hidden; font-size: 13px; font-weight: 620; overflow-wrap: anywhere; }
    .gift-card-meta { display: flex; align-items: center; gap: 8px; min-height: 18px; color: var(--muted); font-size: 11px; }
    .gift-status { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    .selected-status-row { display: flex; justify-content: flex-end; margin: 0 0 10px; }
    .delivery-status { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .status-pill { display: inline-flex; align-items: center; gap: 5px; padding: 6px 8px; border-radius: 999px; background: rgba(255,255,255,.78); color: var(--muted); font-size: 11px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--tertiary); }
    .dot.ok { background: var(--green); } .dot.warn { background: var(--amber); } .dot.fail { background: var(--red); }
    .workspace { display: grid; grid-template-columns: minmax(0,1fr) 390px; gap: 12px; align-items: start; }
    .graph-panel, .inspector { border-radius: var(--radius); background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.035), 0 10px 32px rgba(0,0,0,.025); }
    .graph-panel { min-width: 0; border: 1px solid rgba(222,225,230,.72); }
    .graph-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    .graph-head h2 { margin: 0; font-size: 14px; }
    .graph-head p { margin: 2px 0 0; color: var(--muted); font-size: 11px; }
    .graph-legend { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .graph-scroll { width: 100%; overflow: auto; border-radius: 0 0 var(--radius) var(--radius); scrollbar-width: thin; }
    .graph-canvas {
      position: relative;
      width: 1320px;
      height: 640px;
      background-color: var(--canvas);
      background-image: radial-gradient(circle, #dde1e7 1px, transparent 1.15px);
      background-size: 18px 18px;
      overflow: hidden;
    }
    .edge-layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
    .graph-node {
      position: absolute;
      z-index: 2;
      width: 220px;
      height: 214px;
      overflow: visible;
      padding: 0;
      border: 1px solid #dfe2e7;
      border-radius: 12px;
      background: rgba(255,255,255,.97);
      box-shadow: 0 2px 5px rgba(40,48,60,.05), 0 12px 28px rgba(40,48,60,.045);
      cursor: pointer;
      text-align: left;
      transition: opacity .16s ease, border-color .16s ease, box-shadow .16s ease, transform .16s ease;
    }
    .graph-node:hover { transform: translateY(-1px); border-color: #b7cce4; box-shadow: 0 8px 24px rgba(40,70,100,.10); }
    .graph-node.active { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft), 0 10px 25px rgba(0,80,170,.10); }
    .graph-node.dimmed { opacity: .34; }
    .node-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 42px; padding: 9px 12px; border-bottom: 1px solid var(--line); border-radius: 11px 11px 0 0; background: #fbfbfc; }
    .node-head::before { content: ""; width: 4px; align-self: stretch; border-radius: 4px; background: var(--node-color, var(--blue)); }
    .node-title { flex: 1; min-width: 0; overflow: hidden; font-size: 13px; font-weight: 690; text-overflow: ellipsis; white-space: nowrap; }
    .node-state { display: inline-flex; flex: 0 0 auto; align-items: center; gap: 5px; color: var(--muted); font-size: 10px; }
    .node-body { height: 170px; overflow: hidden; padding: 10px 12px 12px; }
    .node-kv { display: grid; align-content: start; }
    .node-row { display: grid; grid-template-columns: 72px minmax(0,1fr); align-items: start; gap: 8px; min-height: 30px; padding: 6px 0; font-size: 11px; }
    .node-row + .node-row { border-top: 1px solid #f0f1f3; }
    .node-row span:first-child { overflow: hidden; color: var(--muted); font-size: 10px; line-height: 1.35; text-overflow: ellipsis; white-space: nowrap; }
    .node-row b { display: -webkit-box; overflow: hidden; font-size: 11px; font-weight: 610; line-height: 1.35; overflow-wrap: anywhere; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .node-note { margin-top: 5px; overflow: hidden; padding: 4px 7px; border-radius: 7px; background: #f4efff; color: #6541a5; font-size: 10px; font-weight: 600; line-height: 1.3; text-overflow: ellipsis; white-space: nowrap; }
    .node-thumb { position: relative; width: 100%; height: 138px; overflow: hidden; border-radius: 8px; background: #eef0f3; }
    .node-thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .play-mark { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 26px; text-shadow: 0 2px 8px rgba(0,0,0,.7); }
    .port { position: absolute; z-index: 4; top: 50%; width: 10px; height: 10px; margin-top: -5px; border: 2px solid #fff; border-radius: 50%; background: var(--node-color, var(--blue)); box-shadow: 0 0 0 1px rgba(0,0,0,.18); }
    .port.in { left: -5px; } .port.out { right: -5px; }
    .port.bottom { top: auto; bottom: -5px; left: 50%; margin: 0 0 0 -5px; }
    .port.top { top: -5px; left: 50%; margin: 0 0 0 -5px; }
    .inspector { position: sticky; top: 12px; height: 704px; overflow: hidden; }
    .inspector-head { padding: 14px 15px 12px; border-bottom: 1px solid var(--line); }
    .inspector-kicker { color: var(--blue); font-size: 11px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; }
    .inspector-head h2 { margin: 4px 0 3px; font-size: 18px; }
    .inspector-head p { margin: 0; color: var(--muted); font-size: 12px; }
    .inspector-body { height: calc(100% - 82px); overflow: auto; padding: 13px 15px 18px; scrollbar-width: thin; }
    .section { padding: 0 0 13px; margin-bottom: 13px; border-bottom: 1px solid var(--line); }
    .section:last-child { border-bottom: 0; }
    .section h3 { margin: 0 0 8px; font-size: 12px; }
    .section p { margin: 5px 0; color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
    .data-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .data-table th, .data-table td { padding: 6px 0; border-bottom: 1px solid #eff0f2; text-align: left; vertical-align: top; overflow-wrap: anywhere; }
    .data-table th { width: 38%; padding-right: 8px; color: var(--muted); font-weight: 520; }
    .slot-item { padding: 9px 0; border-bottom: 1px solid #eff0f2; }
    .slot-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .slot-top code { color: #075ea9; font-size: 10px; }
    .slot-top strong { font-size: 12px; text-align: right; }
    .slot-meta { margin-top: 4px; color: var(--muted); font-size: 10px; }
    .source-banner { padding: 9px 10px; border-radius: 7px; background: #fff7e8; color: #7b5000; font-size: 11px; }
    .source-banner.formal { margin-bottom: 8px; background: var(--blue-soft); color: #075ea9; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 5px; }
    .tag { padding: 3px 6px; border-radius: 999px; background: #f0f2f5; color: #4e5157; font-size: 10px; }
    .tag.purple { color: #6541a5; background: #f4efff; }
    details { margin-top: 8px; border: 1px solid var(--line); border-radius: 7px; background: #fbfbfc; }
    summary { padding: 8px 9px; cursor: pointer; font-size: 11px; font-weight: 600; }
    .details-content { padding: 9px; border-top: 1px solid var(--line); }
    pre { margin: 0; max-height: 300px; overflow: auto; padding: 9px; border-radius: 6px; background: #f4f5f7; font-size: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .symbol-item { padding: 8px 0; border-bottom: 1px solid #eff0f2; }
    .symbol-item:last-child { border-bottom: 0; }
    .symbol-item b { font-size: 11px; }
    .symbol-item p { margin: 3px 0; }
    .media-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 7px; }
    .media-grid img { width: 100%; aspect-ratio: 1; object-fit: contain; border-radius: 7px; background: #eef0f3; }
    .asset-large { width: 100%; border: 0; border-radius: 8px; padding: 0; overflow: hidden; background: #eef0f3; cursor: zoom-in; }
    .asset-large img { width: 100%; max-height: 390px; object-fit: contain; display: block; }
    .asset-video { width: 100%; max-height: 390px; border-radius: 8px; background: #101114; }
    .copy-button { margin: 0 0 8px; border: 1px solid #b7d6f7; border-radius: 7px; padding: 6px 9px; color: #075ea9; background: var(--blue-soft); cursor: pointer; font-size: 10px; }
    .drawer-backdrop { position: fixed; inset: 0; z-index: 90; display: none; background: rgba(0,0,0,.26); }
    .drawer-backdrop.open { display: block; }
    .contract-drawer { position: fixed; z-index: 100; top: 0; right: 0; width: min(720px,92vw); height: 100vh; overflow: auto; padding: 18px; background: #fff; box-shadow: -20px 0 60px rgba(0,0,0,.16); transform: translateX(103%); transition: transform .2s ease; }
    .contract-drawer.open { transform: translateX(0); }
    .drawer-head { position: sticky; top: -18px; z-index: 2; display: flex; justify-content: space-between; gap: 10px; padding: 18px 0 12px; background: #fff; border-bottom: 1px solid var(--line); }
    .drawer-head h2 { margin: 0; font-size: 18px; }
    .contract-item { padding: 12px 0; border-bottom: 1px solid var(--line); }
    .contract-item h3 { margin: 0 0 7px; font-size: 12px; }
    .lightbox { position: fixed; inset: 0; z-index: 120; display: none; place-items: center; padding: 22px; background: rgba(8,10,13,.84); }
    .lightbox.open { display: grid; }
    .lightbox-panel { width: min(1000px,94vw); max-height: 92vh; overflow: hidden; border-radius: 10px; background: #111; }
    .lightbox-head { display: flex; justify-content: space-between; align-items: center; padding: 9px 11px; color: #fff; border-bottom: 1px solid rgba(255,255,255,.12); }
    .lightbox-head button { border: 1px solid rgba(255,255,255,.2); border-radius: 7px; padding: 5px 8px; color: #fff; background: rgba(255,255,255,.08); cursor: pointer; }
    .lightbox img { display: block; width: 100%; max-height: calc(92vh - 48px); object-fit: contain; }
    @media (max-width: 1350px) {
      .topbar { align-items: flex-start; }
    }
    @media (max-width: 1180px) {
      .topbar { display: block; }
      .top-actions { justify-content: flex-start; margin: 10px 0 0; }
      .business-flow { grid-template-columns: 1fr; gap: 7px; }
      .business-arrow { transform: rotate(90deg); min-height: 12px; }
      .gallery-heading { align-items: stretch; flex-direction: column; }
      .gallery-controls { grid-template-columns: 1fr; min-width: 0; width: 100%; }
      .mode-toggle, .pager, .pager-wrap { justify-content: flex-start; justify-items: start; }
      .workspace { grid-template-columns: 1fr; }
      .inspector { position: static; height: auto; max-height: none; }
      .inspector-body { height: auto; max-height: none; }
    }
    @media (max-width: 760px) {
      .page { padding: 14px; }
      .topbar { display: block; }
      .brand h1 { font-size: 18px; }
      .top-actions { justify-content: flex-start; margin: 10px 0 0; }
      .brand p { display: none; }
      .business-head { align-items: flex-start; flex-direction: column; gap: 3px; }
      .business-flow { grid-template-columns: 1fr; gap: 7px; }
      .business-arrow { transform: rotate(90deg); min-height: 12px; }
      .business-branches { grid-template-columns: 1fr; }
      .gift-gallery { grid-template-columns: 1fr; }
      .gift-card, .gift-thumbs, .gift-thumb { min-width: 0; max-width: 100%; }
      .delivery-status { overflow-x: auto; padding-bottom: 2px; }
      .graph-head { align-items: flex-start; }
      .graph-legend { display: none; }
      .graph-canvas { height: 620px; }
      .workspace { gap: 9px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand"><h1>Community Gifts · 交付工作流</h1><p id="subtitle"></p></div>
      <div class="top-actions">
        <nav class="view-tabs" aria-label="Viewer mode">
          <a class="view-tab" id="showcaseLink" href="index.html">礼物预览</a>
          <a class="view-tab" id="reviewLink" href="review.html">结果审核台</a>
          <span class="view-tab active" id="workflowTabLabel" aria-current="page">工作流画布</span>
        </nav>
        <button class="utility-button" id="contractOpen" type="button">Fields</button>
        <div class="lang-switch" aria-label="Language">
          <button class="lang-button active" data-lang="zh" type="button" aria-pressed="true">中文</button>
          <button class="lang-button" data-lang="en" type="button" aria-pressed="false">EN</button>
        </div>
      </div>
    </header>
    <section class="business-overview" id="businessOverview"></section>
    <section class="gallery-heading">
      <div><h2 id="giftSelectionTitle">礼物选择</h2><p id="giftSelectionSubtitle">选择主播，查看礼物资产和完整工作流。</p></div>
      <div class="gallery-controls">
        <div class="mode-toggle" aria-label="礼物显示模式"><button id="pagedMode" type="button" aria-pressed="true">每页 10 个</button><button id="allMode" type="button" aria-pressed="false">全部展开</button></div>
        <div class="pager-wrap"><nav id="pager" class="pager" aria-label="礼物分页"></nav><div id="galleryRange" class="range-text"></div></div>
      </div>
    </section>
    <section class="gift-gallery" id="giftGallery" aria-label="Creator selection"></section>
    <section class="selected-status-row"><div class="delivery-status" id="deliveryStatus"></div></section>
    <section class="workspace">
      <main class="graph-panel">
        <div class="graph-head"><div><h2 id="graphTitle"></h2><p id="graphSubtitle"></p></div><div class="graph-legend" id="graphLegend"></div></div>
        <div class="graph-scroll" id="graphScroll"><div class="graph-canvas" id="graphCanvas"><svg class="edge-layer" id="edgeLayer" aria-hidden="true"></svg><div id="nodeLayer"></div></div></div>
      </main>
      <aside class="inspector" id="inspector"></aside>
    </section>
  </div>
  <div class="drawer-backdrop" id="contractBackdrop" aria-hidden="true"></div>

  <script>

      {id:'mainline_image', zh:'主线定制图', en:'Mainline custom image', zhDesc:'正式创意方案；通过生成后幕色检查才进入交付。', enDesc:'The primary creative asset. It enters delivery only after chroma validation.', color:'#248a3d'},

      {from:'design_slots',to:'creative_llm',zh:'锁定输入',en:'Locked inputs'},
      {from:'creative_llm',to:'routing_prompt',zh:'创意输出',en:'Creative output'},

      {from:'planb_template',to:'planb_image',zh:'模板 Prompt',en:'Template prompt'}
    ];
    function t(zh,en){ return uiLang === 'zh' ? zh : en; }
    function linkedViewerHref(base,anchorId){ const params=new URLSearchParams(); if(anchorId)params.set('anchor_id',anchorId); if(uiLang==='en')params.set('lang','en'); const query=params.toString(); return query?`${base}?${query}`:base; }
    function syncSelectionUrl(){ const anchorId=String(current()?.viewer_anchor_id||current()?.anchor_id||''); const params=new URLSearchParams(window.location.search); if(anchorId)params.set('anchor_id',anchorId);else params.delete('anchor_id'); if(uiLang==='en')params.set('lang','en');else params.delete('lang'); const query=params.toString(); history.replaceState(null,'',`${window.location.pathname}${query?`?${query}`:''}${window.location.hash}`); }
    function esc(value){ return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
    function valueText(value){ if(value === false) return t('否','No'); if(value === true) return t('是','Yes'); if(value === 0) return '0'; if(Array.isArray(value)) return value.filter(Boolean).join(' · '); if(value && typeof value === 'object') return JSON.stringify(value); return value || '—'; }
    function short(value,max=42){ const text=valueText(value); return text.length > max ? text.slice(0,max-1)+'…' : text; }
    function table(rows){ return `<table class="data-table"><tbody>${rows.map(([k,v])=>`<tr><th>${esc(k)}</th><td>${esc(valueText(v))}</td></tr>`).join('')}</tbody></table>`; }

    function status(status){ const ok=['succeeded','retry_succeeded','present'].includes(status); return {tone:ok?'ok':status==='failed'?'fail':status==='optional'?'':'warn',label:status==='mock'?t('上游示例','Upstream example'):status==='succeeded'?t('成功','Succeeded'):status==='retry_succeeded'?t('重试成功','Retry succeeded'):status==='fallback'?t('由编译记录恢复','Recovered from trace'):status==='failed'?t('失败','Failed'):status==='optional'?t('本轮未生成','Not in this run'):t('缺失','Missing')}; }
    function current(){ return data.items[selectedIndex]; }
    function lineage(id){ const l=current().lineage||{}; if(id==='routing_prompt') return {routing:l.routing||{},prompt:l.prompt_compile?.mainline||{}}; if(id==='mainline_image') return l.static_delivery?.mainline||{}; if(id==='planb_template') return l.prompt_compile?.planb||{}; if(id==='planb_image') return l.static_delivery?.planb||{}; return l[id]||{}; }
    function nodeStatus(id){ const n=lineage(id); if(id==='pak_input') return n.accepted?'succeeded':'failed'; if(id==='design_slots') return n.complete?'succeeded':'failed'; if(id==='creative_llm') return n.status==='succeeded'&&n.actual_source==='creative_llm'&&n.input_mode==='text_only'&&n.prompt_injected===true?'succeeded':'failed'; if(id==='routing_prompt') return n.prompt?.prompt?'succeeded':'missing'; if(id==='mainline_image'&&nodeStatus('creative_llm')!=='succeeded') return 'failed'; if(id==='planb_template') return n.prompt?'succeeded':'missing'; return n.status||'missing'; }
    function nodeRows(id){ const n=lineage(id), item=current();
      if(id==='pak_input') return [['anchor_id',n.accepted_payload?.anchor_id],['exact_text',n.accepted_payload?.exact_text?.text],[t('接收字段','Accepted fields'),n.accepted_fields?.length||0]];
      if(id==='design_slots'){ const f=Object.fromEntries((n.fields||[]).map(x=>[x.field,x])); return [['exact_text',f.exact_text?.value],[t('主物象','Primary'),f.primary_object?.value],[t('次物象','Secondary'),f.secondary_object?.value],['Palette',f.palette?.value]]; }
      if(id==='creative_llm') return [[t('轮廓','Silhouette'),short(n.outputs?.lamp_head_silhouette,30)],[t('风格','Style'),n.outputs?.style_pitch],[t('材质落位','Material application'),short(n.outputs?.material_application,26)]];
      if(id==='routing_prompt') return [[t('最终 Palette','Final palette'),short(n.routing?.color?.final_prompt_palette,30)],['Reference',n.routing?.reference?.selected_id],['Chroma',n.routing?.chroma?.key_color_hex],[t('Prompt 长度','Prompt length'),(n.prompt?.prompt||'').length]];
      if(id==='planb_template') return [[t('文字','Text'),n.inputs?.exact_text],[t('配色','Palette'),n.inputs?.locked_palette],['Creative LLM',n.uses_creative_llm?t('是','Yes'):t('否','No')],[t('模板','Template'),String(n.inputs?.template||'—').split('/').pop()]];
      if(id==='mainline_image'||id==='planb_image') return [['Provider',n.provider],['Model',n.model],[t('尺寸','Size'),n.size],['Chroma',n.chroma?.key_color_hex]];
      return [];
    }
    function resultThumb(id){ const n=lineage(id); return id==='mainline_image'||id==='planb_image' ? n.asset||'' : ''; }
    const mainlineNodeIds = ['pak_input','design_slots','creative_llm','routing_prompt','mainline_image'];
    const planbNodeIds = ['pak_input','design_slots','planb_template','planb_image'];
    const mainlineEdgeIds = new Set(['pak_input>design_slots','design_slots>creative_llm','creative_llm>routing_prompt','routing_prompt>mainline_image']);
    const planbEdgeIds = new Set(['pak_input>design_slots','design_slots>planb_template','planb_template>planb_image']);
    function selectedPathMode(id){ if(id==='planb_template'||id==='planb_image') return 'planb'; if(id==='mainline_image') return 'mainline'; return 'both'; }
    function relatedSet(id){ const mode=selectedPathMode(id), list=mode==='planb'?planbNodeIds:mode==='mainline'?mainlineNodeIds:[...new Set([...mainlineNodeIds,...planbNodeIds])]; return new Set(list); }
    function edgeIsActive(edge){ const key=`${edge.from}>${edge.to}`, mode=selectedPathMode(selectedNode); return mode==='planb'?planbEdgeIds.has(key):mode==='mainline'?mainlineEdgeIds.has(key):mainlineEdgeIds.has(key)||planbEdgeIds.has(key); }
    function renderBusinessOverview(){
      const item=current(), l=item.lineage||{};
      const slotCount=(l.design_slots?.fields||[]).filter(x=>x.complete).length;
      const pakAccepted=Boolean(l.pak_input?.accepted);
      const mainlineOk=l.creative_llm?.status==='succeeded'&&l.static_delivery?.mainline?.status==='succeeded';

        <div class="business-compact"><div class="business-mainline"><span class="business-kicker">${t('生成主线','Generation flow')}</span><strong>Pak JSON → Design Slots → Creative LLM → Routing & Prompt → Image</strong></div><div class="business-facts"><span class="business-fact"><i class="dot ${pakAccepted?'ok':'warn'}"></i>Pak</span><span class="business-fact"><i class="dot ${slotCount===5?'ok':'warn'}"></i>${slotCount}/5 Slots</span><span class="business-fact"><i class="dot ${mainlineOk?'ok':'warn'}"></i>${t('主线图','Mainline')}</span>${planbExpected?`<span class="business-fact"><i class="dot ${planbOk?'ok':'warn'}"></i>PlanB</span>`:''}</div></div>
        <p class="business-note">${planbExpected?(planbOk?t('PlanB 已从锁定 Design Slots 独立生成；不经过 Creative LLM 或主线路由。','PlanB was generated independently from locked Design Slots without Creative LLM or mainline routing.'):t('PlanB 是独立严格模板分支。','PlanB is an independent strict-template branch.')):t('本次未启用 PlanB。','PlanB is disabled for this run.')}</p>`;
    }

    function renderGalleryControls(){
      const total=data.items.length, totalPages=Math.max(1,Math.ceil(total/pageSize));

      const pagedMode=document.getElementById('pagedMode'), allMode=document.getElementById('allMode');

      allMode.setAttribute('aria-pressed',String(galleryMode==='all'));
      pagedMode.onclick=()=>{galleryMode='paged';currentPage=Math.floor(selectedIndex/pageSize);renderHosts();};
      allMode.onclick=()=>{galleryMode='all';renderHosts();};

      if(galleryMode==='all'){pager.innerHTML='';return;}
      pager.innerHTML=Array.from({length:totalPages},(_,page)=>{const pageStart=page*pageSize+1,pageEnd=Math.min((page+1)*pageSize,total);return `<button type="button" class="${page===currentPage?'active':''}" data-page="${page}" title="${pageStart}-${pageEnd}" aria-label="${esc(t(`第 ${page+1} 页，${pageStart}-${pageEnd}`,`Page ${page+1}, items ${pageStart}-${pageEnd}`))}" ${page===currentPage?'aria-current="page"':''}>${page+1}</button>`;}).join('');

    function renderStatus(){ const item=current(), l=item.lineage||{}, slotCount=(l.design_slots?.fields||[]).filter(x=>x.complete).length, creativeOk=l.creative_llm?.status==='succeeded', staticCount=['mainline','planb'].filter(k=>l.static_delivery?.[k]?.status==='succeeded').length, expectedStatic=data.summary?.planb_enabled?2:1, videoOk=l.video_delivery?.status==='succeeded'; document.getElementById('deliveryStatus').innerHTML=`<span class="status-pill"><i class="dot ${slotCount===5?'ok':'warn'}"></i>${slotCount}/5 ${t('设计输入','Inputs')}</span><span class="status-pill"><i class="dot ${creativeOk?'ok':'fail'}"></i>Creative LLM</span><span class="status-pill"><i class="dot ${staticCount===expectedStatic?'ok':'warn'}"></i>${staticCount}/${expectedStatic} ${t('静态图','Static')}</span><span class="status-pill"><i class="dot ${videoOk?'ok':''}"></i>${videoOk?t('视频已生成','Video ready'):t('视频可选','Video optional')}</span>`; }
    function portMarkup(id){

    function drawEdgeLabel(svg,ns,textValue,x,y,active){
      const group=document.createElementNS(ns,'g');
      const rect=document.createElementNS(ns,'rect');
      rect.setAttribute('fill',active?'#eef6ff':'#f4f5f7'); rect.setAttribute('stroke',active?'#c5def8':'#e1e3e7');
      const label=document.createElementNS(ns,'text');
      label.setAttribute('y',y); label.setAttribute('text-anchor','middle'); label.setAttribute('dominant-baseline','middle'); label.setAttribute('font-size','10'); label.setAttribute('font-weight','600'); label.setAttribute('font-family','Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif'); label.setAttribute('fill',active?'#075ea9':'#6e737b'); label.textContent=textValue;
      group.appendChild(rect); group.appendChild(label); svg.appendChild(group);
      const measured=Math.ceil(label.getComputedTextLength());
      const width=Math.min(Math.max(42,measured+20),Math.max(42,svg.clientWidth-16));
      const safeX=Math.max(width/2+8,Math.min(x,svg.clientWidth-width/2-8));
      rect.setAttribute('x',safeX-width/2); rect.setAttribute('y',y-10); rect.setAttribute('width',width); rect.setAttribute('height',20); rect.setAttribute('rx','7');
      label.setAttribute('x',safeX);
    }
    function drawEdges(){
      const svg=document.getElementById('edgeLayer'), canvas=document.getElementById('graphCanvas'), cr=canvas.getBoundingClientRect(), ns='http://www.w3.org/2000/svg';
      svg.innerHTML='<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#aeb4bd"/></marker><marker id="arrowActive" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5b9ee3"/></marker></defs>';
      for(const e of edges){
        const a=document.querySelector(`[data-node="${e.from}"]`), b=document.querySelector(`[data-node="${e.to}"]`);
        const source=a?.querySelector(`[data-port="${e.sourcePort||'out'}"]`), target=b?.querySelector(`[data-port="${e.targetPort||'in'}"]`);
        if(!source||!target) continue;
        const sr=source.getBoundingClientRect(), tr=target.getBoundingClientRect(), sx=sr.left+sr.width/2-cr.left, sy=sr.top+sr.height/2-cr.top, tx=tr.left+tr.width/2-cr.left, ty=tr.top+tr.height/2-cr.top, active=edgeIsActive(e);
        let d='', labelX=(sx+tx)/2, labelY=sy-128;
        if(e.route==='orthogonal'){
          const busY=Math.round(sy+(ty-sy)*.52);
          d=`M${sx},${sy} V${busY} H${tx} V${ty}`;
          labelX=(sx+tx)/2; labelY=busY-15;
        }else if(Math.abs(ty-sy)<2){
          d=`M${sx},${sy} H${tx}`;
        }else{
          const midX=Math.round((sx+tx)/2);
          d=`M${sx},${sy} H${midX} V${ty} H${tx}`;
          labelX=midX; labelY=Math.min(sy,ty)-128;
        }
        const path=document.createElementNS(ns,'path');
        path.setAttribute('d',d); path.setAttribute('fill','none'); path.setAttribute('stroke',active?'#5b9ee3':'#b8bdc5'); path.setAttribute('stroke-width',active?'2':'1.5'); path.setAttribute('stroke-linecap','round'); path.setAttribute('stroke-linejoin','round'); path.setAttribute('marker-end',active?'url(#arrowActive)':'url(#arrow)'); svg.appendChild(path);
        drawEdgeLabel(svg,ns,uiLang==='zh'?e.zh:e.en,labelX,labelY,active);
      }
    }

    function pakInspector(n){ return `<div class="source-banner formal">${t('入口只保留生成字段。任何 reason、rationale、证据引用、贴纸、截图或头像都不会进入设计判断。','The boundary keeps generation fields only. Reasons, rationales, evidence references, stickers, frames, and avatars never enter design decisions.')}</div>`+section(t('进入工作流的 Pak JSON','Pak JSON entering the workflow'),`<pre>${esc(JSON.stringify(n.accepted_payload||{},null,2))}</pre>`)+section(t('入口规则','Boundary rule'),table([[t('接收字段','Accepted fields'),n.accepted_fields],[t('丢弃字段类别','Discarded field classes'),n.discarded_field_classes],[t('转换','Transform'),t('字段白名单 → Design Slots','field whitelist → Design Slots')]])); }

    function creativeInspector(n){ const o=n.outputs||{}; const contract=table([[t('状态','Status'),status(n.status).label],[t('来源','Source'),n.actual_source],[t('输入模式','Input mode'),n.input_mode],[t('Prompt 注入','Prompt injection'),n.prompt_injected?t('已注入','Injected'):t('未注入','Not injected')]]); const materialDetail=o.materials_locked?table([[t('锁定材料','Locked materials'),o.locked_materials],[t('LLM 权限','LLM scope'),t('仅描述材料如何落在轮廓、握柄和灯光中','Describe material application on silhouette, handle, and lighting only')],[t('材料落位','Material application'),o.material_application]]):table([[t('LLM 材质提案','LLM material proposal'),o.material_proposal],[t('材料落位','Material application'),o.material_application]]); return section(t('正式步骤契约','Formal step contract'),contract)+section(t('锁定的纯文本输入','Locked text-only inputs'),table(Object.entries(n.locked_inputs||{})))+section(t('允许的创意输出','Allowed creative outputs'),table([[t('轮廓','Silhouette'),o.lamp_head_silhouette],[t('轮廓语言','Silhouette language'),o.silhouette_language],[t('风格','Style'),o.style_pitch],[t('灯光','Lighting'),o.lighting]]))+section(t('融合与材质落位','Fusion & material application'),`<details open><summary>theme_forms / fusion</summary><div class="details-content"><pre>${esc(JSON.stringify(o.theme_forms||{},null,2))}</pre></div></details><details><summary>materials / handle</summary><div class="details-content">${materialDetail}<pre>${esc(JSON.stringify({handle:o.handle},null,2))}</pre></div></details>`); }
    function compileInspector(n){ const c=n.color||{},o=n.objects||{},m=n.material||{},r=n.reference||{},ch=n.chroma||{}; return section(t('物象安全编译','Object safety compile'),table([[t('主物象：Pak → 最终','Primary: Pak → final'),o.primary?`${o.primary.original_object} → ${o.primary.final_object}`:'—'],[t('主物象调整原因','Primary reason'),o.primary?.reason],[t('次物象：Pak → 最终','Secondary: Pak → final'),o.secondary?`${o.secondary.original_object} → ${o.secondary.final_object}`:'—'],[t('次物象调整原因','Secondary reason'),o.secondary?.reason]]))+section(t('颜色流','Color flow'),table([[t('Pak 原色与顺序','Pak colors and order'),c.observed_input],[t('有限安全调整','Bounded safety adjustments'),c.safety_adjustments],[t('颜色告警','Color warnings'),c.warnings],[t('最终 Prompt Palette','Final prompt palette'),c.final_prompt_palette],[t('审计状态','Audit status'),c.audit_status]]))+section(t('Pak 材料 → 最终材料','Pak materials → final materials'),table([[t('来源','Source'),m.material_source],[t('Pak 原材料','Pak original'),m.original_materials],[t('最终材料 ID','Final IDs'),m.final_materials],[t('Prompt 材质语言','Prompt terms'),m.prompt_terms||m.final_terms],[t('安全调整','Safety remap'),m.safety_remap],[t('调整原因','Reasons'),m.remap_reasons],[t('点缀覆盖','Accent coverage'),m.accent_coverage],[t('不透明背板','Opaque backing'),m.opaque_backing],[t('实色外缘','Solid outer edge'),m.solid_outer_edge],[t('透明风险检查','Transparency check'),m.transparency_risk_check?.status]]))+section('Reference',table([['reference_id',r.selected_id],[t('用途限制','Usage limit'),r.selected_role||r.rule]]))+(r.selected_asset?`<button class="asset-large" type="button" data-preview="${esc(r.selected_asset)}" data-title="Reference"><img src="${esc(r.selected_asset)}" alt="Reference"></button>`:'')+section('Chroma',table([['mode',ch.mode],['key_color_hex',ch.key_color_hex],[t('触发颜色族','Detected families'),ch.detected_color_families],[t('冲突','Conflict'),ch.conflict?ch.conflict_reason:t('无','None')]])); }
    function promptInspector(n,label){ return section(t('结构化字段','Structured fields'),table(Object.entries(n.sections||{})))+section(label,`<button class="copy-button" type="button" data-copy-prompt>${t('复制 Prompt','Copy prompt')}</button><details><summary>${t('完整最终 Prompt','Full final prompt')}</summary><div class="details-content"><pre>${esc(n.prompt||'')}</pre></div></details>`); }

    let contractReturnFocus=null,lightboxReturnFocus=null;

    function trapDialogFocus(event,container){if(event.key!=='Tab'||!container)return;const items=Array.from(container.querySelectorAll('button,[href],[tabindex]:not([tabindex="-1"])')).filter(element=>!element.disabled&&element.getClientRects().length);if(!items.length){event.preventDefault();container.focus();return;}const first=items[0],last=items[items.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}
